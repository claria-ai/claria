[workspace]
resolver = "2"
members = [
    "crates/claria-core",
    "crates/claria-storage",
    "crates/claria-bedrock",
    "crates/claria-provisioner",
    "crates/claria-transcribe",
    "crates/claria-billing",
    "crates/claria-records",
    "crates/claria-report-pipeline",
    "crates/claria-report-store",
    "crates/claria-docx",
    "crates/claria-docx-cli",
    "crates/claria-desktop",
    "crates/claria-eval",
    "crates/claria-mock-aws",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/claria-ai/claria"
homepage = "https://claria-ai.github.io/"
rust-version = "1.97"

[workspace.dependencies]
# Internal crates
claria-bedrock = { path = "crates/claria-bedrock", version = "0.32.0" }
claria-billing = { path = "crates/claria-billing", version = "0.32.0" }
claria-core = { path = "crates/claria-core", version = "0.32.0" }
claria-docx = { path = "crates/claria-docx", version = "0.32.0" }
claria-eval = { path = "crates/claria-eval", version = "0.32.0" }
claria-mock-aws = { path = "crates/claria-mock-aws", version = "0.32.0" }
claria-provisioner = { path = "crates/claria-provisioner", version = "0.32.0" }
claria-records = { path = "crates/claria-records", version = "0.32.0" }
claria-report-pipeline = { path = "crates/claria-report-pipeline", version = "0.32.0" }
claria-report-store = { path = "crates/claria-report-store", version = "0.32.0" }
claria-storage = { path = "crates/claria-storage", version = "0.32.0" }
claria-transcribe = { path = "crates/claria-transcribe", version = "0.32.0" }

# Shared external pins — versions live here only; crates add features they need
#
# The aws-config and aws-sdk-* entries disable default features to drop the
# legacy hyper 0.14 / rustls 0.21 / h2 0.3 connector (the SDKs' default
# "rustls" feature). The app always uses the hyper 1 / rustls 0.23 / aws-lc
# client that `default-https-client` provides (see claria-desktop/src/aws.rs).
aws-config = { version = "=1.8.18", default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "default-https-client",
  "rt-tokio",
  "sso",
] }
aws-credential-types = "=1.2.14"
aws-sdk-bedrock = { version = "=1.147.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "=1.107.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-smithy-eventstream = "=0.60.21"
aws-smithy-types = "=1.5.0"
backon = "=1.6.0"
bytes = "=1.12.0"
dirs = "=6.0.0"
eyre = "=0.6.12"
futures = "=0.3.32"
jiff = { version = "=0.2.31", features = ["serde"] }
lru = "=0.18.0"
# OpenTelemetry, declared here for the pin only. `claria-eval` is the sole
# consumer: the desktop app exports no traces and must gain no otel
# dependency (`cargo tree -p claria-desktop | grep opentelemetry` is empty).
# The four versions are a matched set — opentelemetry 0.32 pairs with
# tracing-opentelemetry 0.33 and no other combination compiles.
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "=0.32.0", default-features = false, features = ["trace"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
specta = { version = "=2.0.0-rc.22", features = ["derive", "uuid"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = "=1.52.3"
# Plaintext h2c to the OTLP receiver: the endpoint is an authority, and TLS
# would pull a second crypto stack in beside aws-lc.
tonic = { version = "=0.14.6", default-features = false }
tracing = "=0.1.44"
tracing-appender = "=0.2.3"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = "=1.23.4"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
# `cargo release` never uploads. The tag it pushes starts
# .github/workflows/publish.yml, which publishes the workspace to crates.io
# over GitHub OIDC — no registry token is stored anywhere, on a laptop or in
# repository secrets.
publish = false
push = true

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
