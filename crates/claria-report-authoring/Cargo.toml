[package]
name = "claria-report-authoring"
version = "0.20.0"
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "=1.8.18"
aws-sdk-s3 = "=1.137.0"
claria-bedrock = { path = "../claria-bedrock" }
claria-core = { path = "../claria-core" }
claria-storage = { path = "../claria-storage" }
jiff = { version = "=0.2.31", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.18"
tracing = "=0.1.44"
uuid = { version = "=1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
aws-credential-types = "=1.2.14"
claria-mock-aws = { path = "../claria-mock-aws" }
tokio = { version = "=1.52.3", features = ["full"] }
