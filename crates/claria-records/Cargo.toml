[package]
name = "claria-records"
version = "0.34.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "S3-backed client records for Claria: client CRUD, record inventory, cached record text, and the delete/restore lifecycle."
keywords = ["claria", "aws", "s3", "records", "clinical"]
categories = ["api-bindings", "database"]
readme = "../../README.md"

[dependencies]
aws-sdk-s3.workspace = true
claria-core.workspace = true
claria-report-store.workspace = true
claria-storage.workspace = true
futures.workspace = true
jiff.workspace = true
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
aws-config.workspace = true
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full"] }
