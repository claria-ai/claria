[package]
name = "claria-docx-cli"
version = "0.34.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Command-line tool that reports how Claria's importer classifies every paragraph and style of a .docx template."
keywords = ["claria", "docx", "ooxml", "cli", "template"]
categories = ["command-line-utilities", "text-processing"]
readme = "../../README.md"

# A support tool, not part of the app. It lives in its own crate so `clap`
# and `eyre` stay out of `claria-docx` and therefore out of the shipped
# desktop binary, which links that crate.
[[bin]]
name = "claria-docx"
path = "src/main.rs"

[dependencies]
claria-docx.workspace = true
clap = { version = "=4.6.1", features = ["derive"] }
eyre.workspace = true
