[package]
name = "claria-provisioner"
version = "0.34.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Scan/plan/execute engine that provisions and hardens the AWS account Claria runs in."
keywords = ["claria", "aws", "iam", "provisioning", "hipaa"]
categories = ["api-bindings", "development-tools"]
readme = "../../README.md"

[dependencies]
claria-core.workspace = true
claria-storage.workspace = true
aws-config.workspace = true
aws-sdk-artifact = { version = "=1.94.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrock.workspace = true
aws-sdk-cloudtrail = { version = "=1.112.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "=1.113.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
aws-smithy-types.workspace = true
backon.workspace = true
serde.workspace = true
specta = { workspace = true, features = ["serde_json"] }
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
tracing.workspace = true

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full"] }
