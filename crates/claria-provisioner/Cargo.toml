[package]
name = "claria-provisioner"
version = "0.16.3"
edition.workspace = true
license.workspace = true

[dependencies]
claria-core = { path = "../claria-core" }
claria-storage = { path = "../claria-storage" }
claria-audit = { path = "../claria-audit" }
aws-config = "=1.8.16"
aws-sdk-artifact = "=1.89.0"
aws-sdk-bedrock = "=1.141.0"
aws-sdk-cloudtrail = "=1.107.0"
aws-sdk-iam = "=1.108.1"
aws-sdk-s3 = "=1.132.0"
aws-sdk-sts = "=1.103.0"
serde = { version = "=1.0.228", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
serde_json = "=1.0.149"
dirs = "=6.0.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
percent-encoding = "=2.3.2"
tracing = "=0.1.44"
