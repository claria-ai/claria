[package]
name = "claria-provisioner"
version = "0.18.0"
edition.workspace = true
license.workspace = true

[dependencies]
claria-core = { path = "../claria-core" }
claria-storage = { path = "../claria-storage" }
aws-config = "=1.8.18"
aws-sdk-artifact = "=1.94.0"
aws-sdk-bedrock = "=1.147.0"
aws-sdk-cloudtrail = "=1.112.0"
aws-sdk-iam = "=1.113.0"
aws-sdk-s3 = "=1.137.0"
aws-sdk-sts = "=1.107.0"
aws-smithy-types = "=1.5.0"
backon = "=1.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
serde_json = "=1.0.150"
dirs = "=6.0.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
percent-encoding = "=2.3.2"
tracing = "=0.1.44"

[dev-dependencies]
aws-credential-types = "=1.2.14"
claria-mock-aws = { path = "../claria-mock-aws" }
