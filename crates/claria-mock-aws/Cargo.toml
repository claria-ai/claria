[package]
name = "claria-mock-aws"
version = "0.34.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "In-process fake of the AWS APIs Claria calls (S3, STS, IAM, Bedrock, CloudTrail, Cost Explorer, Transcribe, Artifact) for driving real SDK clients in tests."
keywords = ["claria", "aws", "mock", "testing", "s3"]
categories = ["development-tools::testing"]
readme = "../../README.md"

[dependencies]
aws-smithy-eventstream.workspace = true
aws-smithy-types.workspace = true
axum = "=0.8.9"
bytes.workspace = true
clap = { version = "=4.6.1", features = ["derive"] }
eyre.workspace = true
futures.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.3", features = ["util"] }
