[package]
name = "claria-transcribe"
version = "0.28.0"
edition.workspace = true
license.workspace = true

[features]
default = []
metal = ["transcribe-cpp/metal"]
vulkan = ["transcribe-cpp/vulkan"]
cuda = ["transcribe-cpp/cuda"]
rocm = ["transcribe-cpp/rocm"]
openmp = ["transcribe-cpp/openmp"]

[dependencies]
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-transcribe = { version = "=1.108.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
backon.workspace = true
claria-core.workspace = true
claria-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "553f1099a2b3a5bc4421894be171f09960fc0f3a", default-features = false }
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
cc = "=1.2.66"

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full"] }
