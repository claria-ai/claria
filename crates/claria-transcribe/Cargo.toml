[package]
name = "claria-transcribe"
version = "0.18.0"
edition.workspace = true
license.workspace = true

[dependencies]
aws-config = "=1.8.18"
aws-sdk-s3 = "=1.137.0"
aws-sdk-transcribe = "=1.108.0"
claria-storage = { path = "../claria-storage" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
tracing = "=0.1.44"
uuid = { version = "=1.23.4", features = ["v4"] }

[dev-dependencies]
aws-credential-types = "=1.2.14"
claria-mock-aws = { path = "../claria-mock-aws" }
