[package]
name = "claria-desktop"
version = "0.32.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not publishable, for three independent reasons: it depends on
# `claria-transcribe`, which carries a git dependency; its build script builds
# `claria-desktop-frontend/`, which lives outside the package directory and so
# is absent from the packaged .crate; and it is the shipped application, which
# is distributed as a signed Tauri bundle from the GitHub release, not as a
# `cargo install` target.
publish = false

[features]
default = []
metal = ["claria-transcribe/metal"]
vulkan = ["claria-transcribe/vulkan"]
cuda = ["claria-transcribe/cuda"]
rocm = ["claria-transcribe/rocm"]
openmp = ["claria-transcribe/openmp"]

[dependencies]
claria-bedrock.workspace = true
claria-billing.workspace = true
claria-core.workspace = true
claria-docx.workspace = true
claria-provisioner.workspace = true
claria-records.workspace = true
claria.workspace = true
claria-report-store.workspace = true
claria-storage.workspace = true
claria-transcribe.workspace = true
argon2 = "=0.5.3"
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
aws-smithy-http-client = { version = "=1.1.13", features = ["rustls-aws-lc"] }
base64 = "=0.22.1"
color-eyre = "=0.6.5"
dirs.workspace = true
eyre.workspace = true
futures.workspace = true
rfd = "=0.17.2"
jiff.workspace = true
lru.workspace = true
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
specta-typescript = "=0.0.9"
tauri = { version = "=2.11.5", features = [] }
# Biometric unlock. 0.2.8 is the newest stable line; 0.3.0 is still an rc
# and a release candidate is not what a lock screen runs on.
tauri-plugin-biometry = "=0.2.8"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
thiserror.workspace = true
# `rt-multi-thread` is what Tauri's runtime uses; declared here because this
# crate now builds that runtime itself rather than relying on the feature
# arriving through Tauri's own dependency.
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-appender.workspace = true
# rustls is only here so the ureq agent can reuse the aws-lc crypto provider
# the AWS clients already link (see src/http.rs).
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std"] }
ureq = { version = "=3.3.0", default-features = false, features = ["platform-verifier", "rustls-no-provider"] }
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tempfile.workspace = true

[package.metadata.release]
pre-release-replacements = [
  { file = "tauri.conf.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"" },
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [{{version}}] — {{date}}" },
]

[target.'cfg(windows)'.dependencies]
# Same version tauri already carries on Windows; used for ShellExecuteW so
# open_url never round-trips through a shell.
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
