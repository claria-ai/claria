[package]
name = "claria-desktop"
version = "0.22.0"
edition.workspace = true
license.workspace = true

[features]
default = []
metal = ["claria-transcribe/metal"]
vulkan = ["claria-transcribe/vulkan"]
cuda = ["claria-transcribe/cuda"]
rocm = ["claria-transcribe/rocm"]
openmp = ["claria-transcribe/openmp"]

[dependencies]
claria-audit.workspace = true
claria-bedrock.workspace = true
claria-billing.workspace = true
claria-client-lifecycle.workspace = true
claria-core.workspace = true
claria-docx.workspace = true
claria-provisioner.workspace = true
claria-report-authoring.workspace = true
claria-storage.workspace = true
claria-transcribe.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
aws-smithy-http-client = { version = "=1.1.13", features = ["default-client", "rustls-aws-lc"] }
base64 = "=0.22.1"
color-eyre = "=0.6.5"
dirs.workspace = true
eyre.workspace = true
futures = "=0.3.32"
rfd = "=0.17.2"
jiff.workspace = true
lru = "=0.18.0"
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
specta-typescript = "=0.0.9"
tauri = { version = "=2.11.5", features = [] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
ureq = "=3.3.0"
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tempfile.workspace = true

[package.metadata.release]
pre-release-replacements = [
  { file = "tauri.conf.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"" },
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [{{version}}] — {{date}}" },
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
