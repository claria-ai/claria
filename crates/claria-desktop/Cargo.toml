[package]
name = "claria-desktop"
version = "0.18.0"
edition.workspace = true
license.workspace = true

[features]
default = []
metal = ["claria-whisper/metal"]

[dependencies]
claria-audit = { path = "../claria-audit" }
claria-bedrock = { path = "../claria-bedrock" }
claria-billing = { path = "../claria-billing" }
claria-core = { path = "../claria-core" }
claria-provisioner = { path = "../claria-provisioner" }
claria-storage = { path = "../claria-storage" }
claria-transcribe = { path = "../claria-transcribe" }
claria-whisper = { path = "../claria-whisper" }
argon2 = "=0.5.3"
aws-config = "=1.8.18"
aws-sdk-s3 = "=1.137.0"
aws-sdk-sts = "=1.107.0"
aws-smithy-http-client = { version = "=1.1.13", features = ["default-client", "rustls-aws-lc"] }
base64 = "=0.22.1"
color-eyre = "=0.6.5"
dirs = "=6.0.0"
eyre = "=0.6.12"
futures = "=0.3.32"
rfd = "=0.17.2"
jiff = { version = "=0.2.31", features = ["serde"] }
lru = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri = { version = "=2.11.5", features = [] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tokio = { version = "=1.52.3", features = ["full"] }
tracing = "=0.1.44"
ureq = "=3.3.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.23.4", features = ["v4"] }

[dev-dependencies]
aws-credential-types = "=1.2.14"
claria-mock-aws = { path = "../claria-mock-aws" }

[package.metadata.release]
pre-release-replacements = [
  { file = "tauri.conf.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"" },
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [{{version}}] — {{date}}" },
]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
