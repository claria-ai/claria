[package]
name = "claria-bedrock"
version = "0.34.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Amazon Bedrock model calls for Claria: streaming Converse, token budgets, throttle retries, and forced-tool structured output."
keywords = ["claria", "aws", "bedrock", "llm", "claude"]
categories = ["api-bindings", "artificial-intelligence"]
readme = "../../README.md"

[dependencies]
aws-config.workspace = true
aws-sdk-bedrock.workspace = true
aws-sdk-bedrockruntime = { version = "=1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types.workspace = true
backon.workspace = true
claria-billing.workspace = true
claria-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
