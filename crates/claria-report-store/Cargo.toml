[package]
name = "claria-report-store"
version = "0.34.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Durable S3-backed writer state for Claria reports: workspaces, revisions, drafting runs, findings, and usage receipts."
keywords = ["claria", "aws", "s3", "reports", "versioning"]
categories = ["api-bindings", "database"]
readme = "../../README.md"

[dependencies]
aws-sdk-s3.workspace = true
claria-core.workspace = true
claria-storage.workspace = true
futures.workspace = true
jiff.workspace = true
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
aws-config.workspace = true
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full"] }
