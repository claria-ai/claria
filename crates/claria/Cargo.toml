[package]
name = "claria"
version = "0.34.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Report-writing orchestration for Claria: section planning, parallel drafting runs, bounded record tools, and review sweeps."
keywords = ["claria", "bedrock", "llm", "reports", "agent"]
categories = ["artificial-intelligence"]
readme = "../../README.md"

[dependencies]
aws-config.workspace = true
aws-sdk-s3.workspace = true
claria-bedrock.workspace = true
claria-core.workspace = true
claria-report-store.workspace = true
claria-storage.workspace = true
futures.workspace = true
jiff.workspace = true
lru.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
aws-credential-types.workspace = true
claria-mock-aws.workspace = true
tokio = { workspace = true, features = ["full"] }
