[package]
name = "claria-core"
version = "0.18.0"
edition.workspace = true
license.workspace = true

[dependencies]
jiff = { version = "=0.2.31", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tantivy = "=0.26.1"
thiserror = "=2.0.18"
ts-rs = { version = "=12.0.1", features = ["uuid-impl", "jiff-impl", "serde-json-impl"] }
uuid = { version = "=1.23.4", features = ["v4", "serde"] }
