[package]
name = "claria-docx"
version = "0.34.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Bounded DOCX template import and deterministic OOXML report rendering, with no filesystem or network access."
keywords = ["claria", "docx", "ooxml", "word", "template"]
categories = ["text-processing", "parser-implementations"]
readme = "../../README.md"

[dependencies]
claria-core.workspace = true
docx-rs = { version = "=0.4.22", default-features = false }
quick-xml = "=0.41.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
