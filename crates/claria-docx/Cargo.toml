[package]
name = "claria-docx"
version = "0.20.0"
edition.workspace = true
license.workspace = true

[dependencies]
claria-core = { path = "../claria-core" }
docx-rs = { version = "=0.4.22", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.18"
uuid = { version = "=1.23.4", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
quick-xml = "=0.41.0"
tempfile = "=3.27.0"
