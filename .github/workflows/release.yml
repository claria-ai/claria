name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features metal"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm install

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      # --- Rust ---
      - name: Rust setup (toolchain, sccache, caches)
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # --- Cache warm-up (main branch only) ---
      # Must produce the same cargo fingerprints as tauri-action's `tauri build` below, or tag
      # builds recompile instead of hitting this cache: `tauri build` always enables
      # tauri/custom-protocol and, on macOS, exports MACOSX_DEPLOYMENT_TARGET from
      # bundle.macOS.minimumSystemVersion (default 10.13) — cc-rs build scripts track that env
      # var, so a mismatch rebuilds every native dep and its dependents (~60 crates, ~4 min).
      - name: Build (warm cache)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13" # inert on Windows
        run: cargo build --release -p claria-desktop --features tauri/custom-protocol ${{ matrix.args }}

      # --- Build & Release (tags only) ---
      - name: Extract changelog
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found=1; next } }
            found
          ' CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/claria-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Claria ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
