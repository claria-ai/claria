name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features metal"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      # --- Rust ---
      - name: Rust setup (toolchain, sccache, caches)
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # --- Cache warm-up (main branch only) ---
      # Must produce the same cargo fingerprints as tauri-action's `tauri build` below, or tag
      # builds recompile instead of hitting this cache: `tauri build` always enables
      # tauri/custom-protocol and, on macOS, exports MACOSX_DEPLOYMENT_TARGET from
      # bundle.macOS.minimumSystemVersion — cc-rs build scripts track that env var, so a mismatch
      # rebuilds every native dep and its dependents (~60 crates, ~4 min).
      - name: Build (warm cache)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0" # matches tauri.conf.json; inert on Windows
        run: cargo build --release -p claria-desktop --features tauri/custom-protocol ${{ matrix.args }}

      # --- Build & Release (tags only) ---
      - name: Extract changelog
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found=1; next } }
            found
          ' CHANGELOG.md)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/claria-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Claria ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  update_release_site:
    name: Update release site
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: macos-latest
    concurrency:
      group: claria-release-site
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: screenshots/.nvmrc
          cache: npm
          cache-dependency-path: |
            claria-desktop-frontend/package-lock.json
            screenshots/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Install screenshot dependencies
        working-directory: screenshots
        run: npm ci --no-fund

      - name: Install Chromium
        working-directory: screenshots
        run: npx playwright install chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site generator dependencies
        run: python -m pip install --disable-pip-version-check "jinja2==3.1.6" "pyyaml==6.0.2"

      - name: Checkout release site
        uses: actions/checkout@v4
        with:
          repository: claria-ai/claria-ai.github.io
          token: ${{ secrets.CLARIA_SITE_TOKEN }}
          ref: main
          path: release-site

      - name: Regenerate release site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./screenshots/update_release_site.py "$GITHUB_REF_NAME" --site "$GITHUB_WORKSPACE/release-site"

      - name: Commit and push release site
        working-directory: release-site
        run: |
          git config user.name "claria-release[bot]"
          git config user.email "claria-release@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "release site is already current"
            exit 0
          fi
          git add -A
          git commit -m "chore: point downloads at Claria $GITHUB_REF_NAME"
          git push origin HEAD:main
