name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Timeouts are two-layered, because a job timeout can only ever be as tight as
# the slowest legitimate run of that job.
#
#   Job level    sized to that job's own observed history with 30 minutes as the
#                ceiling. Across 254 successful jobs, exactly one has ever run
#                past 20 minutes (Test/ubuntu, 23.9m; the next slowest is 14.3m).
#                Sized at roughly 2x the worst real observation, not that
#                sample's max — a cold cache can double a job's runtime, and
#                Clippy/windows did exactly that (4.6m sampled, 9.9m observed).
#
#   Step level   every dependency-acquisition step — checkout, toolchain setup,
#                package installs — is bounded at 5 minutes (10 for rust-setup,
#                which restores the large cargo cache archive). These are
#                pure network and finish in seconds, so a wedged one is caught in
#                minutes rather than burning the job's whole compile allowance.
#
# GitHub's default is 360 minutes. An unbounded hang in "Install system
# dependencies" spent exactly that much on 2026-08-19 and reported every step
# after it as skipped.

jobs:
  # Decides which lanes a pull request needs. Fail-open throughout: a push to
  # main runs everything, an unrecognised path runs everything, an empty or
  # failed diff runs everything, and the jobs below test `!= 'false'`, so a
  # missing output (this job failed or was skipped) also runs everything.
  #
  # The diff is the PR merge commit against its first parent, the base branch
  # tip it was merged onto, which is exactly what the PR changes; fetch-depth 2
  # is enough to see it.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_rust: ${{ steps.classify.outputs.run_rust }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          run_all() {
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            echo "$1: running every lane"
            exit 0
          }
          [ "$EVENT_NAME" = pull_request ] || run_all "$EVENT_NAME event"
          paths=$(git diff --name-only --no-renames HEAD^1 HEAD) || run_all "git diff failed"
          [ -n "$paths" ] || run_all "empty diff"

          run_rust=false
          run_frontend=false
          while IFS= read -r path; do
            case "$path" in
              crates/*|Cargo.toml|Cargo.lock|rustfmt.toml|rust-toolchain*|.cargo/*)
                run_rust=true ;;
              claria-desktop-frontend/*|e2e/*|screenshots/*|package.json|package-lock.json)
                run_frontend=true ;;
              *.md|design/*|plans/*|LICENSE)
                ;;
              *)
                # .github/** and anything not listed above (fixtures/ feeds
                # Rust tests, for one): run both.
                run_rust=true
                run_frontend=true ;;
            esac
          done <<< "$paths"

          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$run_frontend" >> "$GITHUB_OUTPUT"
          echo "run_rust=$run_rust run_frontend=$run_frontend"
          echo "$paths"

  # Not matrixed: this job compiles no Rust and touches no platform API. The
  # bundle it produces is byte-identical everywhere, so a second run would only
  # re-prove Node's portability.
  frontend:
    name: Frontend (lint + test + build)
    needs: changes
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install dependencies
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Lint
        working-directory: claria-desktop-frontend
        run: npm run lint

      - name: Test
        working-directory: claria-desktop-frontend
        run: npm test

      - name: Build
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Test release-site helper
        run: python3 -m unittest discover -s screenshots/tests

  # The two Rust jobs below fan out over `matrix.os`. Everything that differs
  # between runners is behind `runner.os`, so a new platform is one more entry
  # in each list — macos-latest being the obvious next one.
  clippy:
    name: Clippy
    needs: changes
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake

      # No frontend build: without tauri's custom-protocol feature,
      # generate_context! embeds no assets and points the WebView at devUrl, so
      # this job never reads claria-desktop-frontend/dist. CI=true already
      # stops build.rs from running npm.

      - name: Rust setup (toolchain, cache, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Clippy (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake

      # No frontend build: without tauri's custom-protocol feature,
      # generate_context! embeds no assets and points the WebView at devUrl, so
      # this job never reads claria-desktop-frontend/dist. CI=true already
      # stops build.rs from running npm.

      - name: Rust setup (toolchain, cache, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup

      # Compile and run as separate steps so the job's timing shows which one
      # moved. The second step reuses every artifact the first built.
      - name: Build tests (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo test --workspace --no-run

      - name: Test (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: cargo test --workspace --no-run 2>&1 | grep -E 'dirty|stale|Compiling|Finished'

  # Not matrixed: the payload here is the xvfb smoke test, which exists to catch
  # a Tauri Rust/JS API mismatch killing the WebView on launch. That needs a
  # headless X server and a display-less runner cannot substitute for it. The
  # Rust code itself is compiled on every matrix platform by the jobs above.
  tauri-build:
    name: Tauri build
    needs: changes
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake xvfb

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, cache, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup

      # `ci-release` is `release` without fat LTO and with 16 codegen units
      # (root Cargo.toml). The shipped binaries still build with `release`.
      #
      # tauri/custom-protocol is what `tauri build` turns on. Without it the
      # binary embeds no frontend and points the WebView at devUrl
      # (localhost:1420, nothing listening), so the smoke test below would
      # never load the bundle whose Rust/JS API match it exists to check.
      - name: Build Tauri app
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo build --profile ci-release -p claria-desktop --features tauri/custom-protocol

      - name: Smoke test (WebView loads without crashing)
        timeout-minutes: 5
        if: github.event.pull_request.draft != true
        env:
          RUST_LOG: debug
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: |
          set -u
          mkdir -p "$HOME/.config/claria"
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
            ./target/ci-release/claria-desktop > smoke.log 2>&1 &
          PID=$!
          # Give the WebView time to initialize and crash if it's going to.
          sleep 15
          STATUS=0
          if ! kill -0 "$PID" 2>/dev/null; then
            echo '::error::claria-desktop exited before the smoke window elapsed'
            STATUS=1
          fi
          if grep -q 'web content process terminated' smoke.log; then
            echo '::error::WebView crashed on launch — likely a Tauri Rust/JS API version mismatch. See https://github.com/claria-ai/claria/blob/main/CLAUDE.md#running-locally'
            STATUS=1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo '--- smoke.log ---'
          cat smoke.log
          exit "$STATUS"
