name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Timeouts are two-layered, because a job timeout can only ever be as tight as
# the slowest legitimate run of that job.
#
#   Job level    sized to that job's own observed history with 30 minutes as the
#                ceiling. Across 254 successful jobs, exactly one has ever run
#                past 20 minutes (Test/ubuntu, 23.9m; the next slowest is 14.3m).
#                Sized at roughly 2x the worst real observation, not that
#                sample's max — a cold cache can double a job's runtime, and
#                Clippy/windows did exactly that (4.6m sampled, 9.9m observed).
#
#   Step level   every dependency-acquisition step — checkout, toolchain setup,
#                package installs — is bounded at 5 minutes (10 for rust-setup,
#                which restores the large cargo and sccache archives). These are
#                pure network and finish in seconds, so a wedged one is caught in
#                minutes rather than burning the job's whole compile allowance.
#
# GitHub's default is 360 minutes. An unbounded hang in "Install system
# dependencies" spent exactly that much on 2026-08-19 and reported every step
# after it as skipped.

jobs:
  # Not matrixed: this job compiles no Rust and touches no platform API. The
  # bundle it produces is byte-identical everywhere, so a second run would only
  # re-prove Node's portability.
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install dependencies
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Lint
        working-directory: claria-desktop-frontend
        run: npm run lint

      - name: Test
        working-directory: claria-desktop-frontend
        run: npm test

      - name: Build
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Test release-site helper
        run: python3 -m unittest discover -s screenshots/tests

  # The two Rust jobs below fan out over `matrix.os`. Everything that differs
  # between runners is behind `runner.os`, so a new platform is one more entry
  # in each list — macos-latest being the obvious next one.
  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Clippy (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup

      - name: Test (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo test --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Not matrixed: the payload here is the xvfb smoke test, which exists to catch
  # a Tauri Rust/JS API mismatch killing the WebView on launch. That needs a
  # headless X server and a display-less runner cannot substitute for it. The
  # Rust code itself is compiled on every matrix platform by the jobs above.
  tauri-build:
    name: Tauri build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged here on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev mold clang cmake xvfb

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        timeout-minutes: 5
        working-directory: claria-desktop-frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        timeout-minutes: 10
        uses: ./.github/actions/rust-setup

      - name: Build Tauri app
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo build --release -p claria-desktop

      - name: Smoke test (WebView loads without crashing)
        timeout-minutes: 5
        if: github.event.pull_request.draft != true
        env:
          RUST_LOG: debug
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: |
          set -u
          mkdir -p "$HOME/.config/claria"
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
            ./target/release/claria-desktop > smoke.log 2>&1 &
          PID=$!
          # Give the WebView time to initialize and crash if it's going to.
          sleep 15
          STATUS=0
          if ! kill -0 "$PID" 2>/dev/null; then
            echo '::error::claria-desktop exited before the smoke window elapsed'
            STATUS=1
          fi
          if grep -q 'web content process terminated' smoke.log; then
            echo '::error::WebView crashed on launch — likely a Tauri Rust/JS API version mismatch. See https://github.com/claria-ai/claria/blob/main/CLAUDE.md#running-locally'
            STATUS=1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo '--- smoke.log ---'
          cat smoke.log
          exit "$STATUS"
