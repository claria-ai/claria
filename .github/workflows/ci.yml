name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install dependencies
        working-directory: claria-desktop-frontend
        run: npm ci

      - name: Lint
        working-directory: claria-desktop-frontend
        run: npm run lint

      - name: Test
        working-directory: claria-desktop-frontend
        run: npm test

      - name: Build
        working-directory: claria-desktop-frontend
        run: npm run build

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev mold clang
          version: 1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm ci

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        uses: ./.github/actions/rust-setup
        with:
          components: clippy

      - name: Clippy (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev mold clang
          version: 1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm ci

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        uses: ./.github/actions/rust-setup

      - name: Test (workspace)
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo test --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  tauri-build:
    name: Tauri build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev mold clang xvfb
          version: 1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: claria-desktop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: claria-desktop-frontend
        run: npm ci

      - name: Build frontend
        working-directory: claria-desktop-frontend
        run: npm run build

      - name: Rust setup (toolchain, sccache, caches, mold)
        uses: ./.github/actions/rust-setup

      - name: Build Tauri app
        env:
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: cargo build --release -p claria-desktop

      - name: Smoke test (WebView loads without crashing)
        if: github.event.pull_request.draft != true
        env:
          RUST_LOG: debug
          CLARIA_SKIP_FRONTEND_BUILD: '1'
        run: |
          set -u
          mkdir -p $HOME/.config/claria
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' \
            ./target/release/claria-desktop > smoke.log 2>&1 &
          PID=$!
          # Give the WebView time to initialize and crash if it's going to.
          sleep 15
          STATUS=0
          if ! kill -0 "$PID" 2>/dev/null; then
            echo '::error::claria-desktop exited before the smoke window elapsed'
            STATUS=1
          fi
          if grep -q 'web content process terminated' smoke.log; then
            echo '::error::WebView crashed on launch — likely a Tauri Rust/JS API version mismatch. See https://github.com/claria-ai/claria/blob/main/CLAUDE.md#running-locally'
            STATUS=1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo '--- smoke.log ---'
          cat smoke.log
          exit $STATUS
