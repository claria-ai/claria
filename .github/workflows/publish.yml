name: Publish

# crates.io Trusted Publishing binds a GitHub OIDC identity to the triple
# (repository owner, repository name, workflow filename). The registered
# workflow filename is `publish.yml` — renaming this file silently invalidates
# every registered config and every publish starts failing authentication.
# Re-register with ./scripts/register-trusted-publishing.sh if it ever moves.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The only two permissions this needs, and the reason there is no
# CARGO_REGISTRY_TOKEN in this repository's secrets:
#   id-token: write  — lets the job mint a short-lived GitHub OIDC JWT, which
#                      crates.io exchanges for a registry token scoped to this
#                      workflow. The auth action's post step revokes it when
#                      the job ends.
#   contents: read   — checkout only. This workflow writes nothing to the repo.
permissions:
  contents: read
  id-token: write

# Tag pushes also start release.yml. Publishing is not cancellable half-way —
# a partially published workspace has to be finished by hand, because crates.io
# versions cannot be re-uploaded.
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # clang and mold because rust-setup writes a mold linker config on Linux;
      # cmake because aws-lc-sys builds from source during `cargo publish`'s
      # verification step.
      # Plain apt-get rather than a caching action: awalsh128/cache-apt-pkgs-action
      # wedged the CI jobs on 2026-08-19 and held the job open until the 6h limit, taking
      # every downstream step with it. These packages cost well under a minute to
      # install outright, which is not worth a step that can hang.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake mold

      - name: Rust setup (toolchain, sccache, caches, mold)
        uses: ./.github/actions/rust-setup

      # Pinned by commit SHA rather than the floating `@v1`: this action mints a
      # registry credential, so a moved upstream tag must not be able to change
      # what runs here.
      #
      # It POSTs the GitHub OIDC JWT to /api/v1/trusted_publishing/tokens and
      # returns the temporary token crates.io hands back.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--workspace` makes cargo derive the publish order from the dependency
      # graph and wait for each crate to land in the index before publishing the
      # crates that depend on it. Today that order is:
      #
      #   claria-core, claria-mock-aws, claria-billing, claria-docx,
      #   claria-storage, claria-bedrock, claria-docx-cli, claria-provisioner,
      #   claria-report-store, claria-records, claria-report-pipeline,
      #   claria-eval
      #
      # claria-desktop and claria-transcribe are `publish = false` and are
      # skipped; each says why at the top of its Cargo.toml.
      #
      # A crate version already on crates.io fails the whole run — re-running a
      # tag is not idempotent. Finish a partial publish with
      # `cargo publish -p <remaining crates>` in the order above.
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats
